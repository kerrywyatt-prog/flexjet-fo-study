  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="styles-v5.css?v=26.11" />
  <style id="force-wide">
    /* Hard override so a stale cached stylesheet cannot keep the phone shell */
    html, body, #app { width: 100% !important; max-width: none !important; margin: 0 !important; }
    #app { border: none !important; box-shadow: none !important; }
    @media (min-width: 500px) {
      .tiles { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; }
      .content { width: 100% !important; max-width: none !important; padding-left: 28px !important; padding-right: 28px !important; }
      .shell { width: 100% !important; }
    }
    @media (min-width: 1024px) {
      .tiles { grid-template-columns: 1fr 1fr 1fr !important; }
      .content { max-width: 1200px !important; margin-left: auto !important; margin-right: auto !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="study-v25.js?v=26.11" defer></script>
  <script src="cth-quiz.js?v=26.11" defer></script>
  <script src="app-v5.js?v=26.11" defer></script>
  <script>
    // v26.11 · Network-passthrough SW clears old Cache API shells and reloads once per build.
    // Does not store HTML/JS (avoids re-pinning a phone layout). Manual top-bar Reload still hard-busts.
    (function () {
      var BUILD = '26.11';
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.addEventListener('message', function (ev) {
        var d = ev.data || {};
        if (d.type !== 'FO_STUDY_SW_UPDATED') return;
        var k = 'fo_sw_reloaded_' + (d.build || BUILD);
        try {
          if (sessionStorage.getItem(k)) return;
          sessionStorage.setItem(k, '1');
        } catch (e) {}
        location.reload();
      });
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) {
          var url = r.active && r.active.scriptURL || '';
          if (url.indexOf('sw.js') !== -1) return null;
          return r.unregister();
        }));
      }).then(function () {
        return navigator.serviceWorker.register('./sw.js?v=' + BUILD);
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k.indexOf('fo-study-') === 0 && k !== 'fo-study-26.11') caches.delete(k);
          });
        });
      }
    })();
  </script>
</body>
