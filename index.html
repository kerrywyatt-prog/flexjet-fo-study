  <link rel="stylesheet" href="styles-v5.css?v=25.2" />
  <style id="force-wide">
    /* Hard override so a stale cached stylesheet cannot keep the phone shell */
    html, body, #app { width: 100% !important; max-width: none !important; margin: 0 !important; }
    #app { border: none !important; box-shadow: none !important; }
    @media (min-width: 500px) {
      .tiles { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; }
      .content { width: 100% !important; max-width: none !important; padding-left: 28px !important; padding-right: 28px !important; }
      .shell { width: 100% !important; }
    }
    @media (min-width: 1024px) {
      .tiles { grid-template-columns: 1fr 1fr 1fr !important; }
      .content { max-width: 1200px !important; margin-left: auto !important; margin-right: auto !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="study-v25.js?v=25.2" defer></script>
  <script src="app-v5.js?v=25.2" defer></script>
  <script>
    // Kill any old service workers that were pinning the phone layout
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      });
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
      }
    }
  </script>
</body>
